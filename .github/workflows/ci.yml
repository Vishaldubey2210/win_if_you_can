name: SLOPGUARD CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Full Test Suite
      run: |
        python -m pytest tests/

    - name: Enforce SLOPGUARD Dependency Firewall Gate
      run: |
        python scripts/ci_check.py pyproject.toml --profile strict_ci --output-json slopguard-report.json

    - name: Archive Security Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: slopguard-audit-report
        path: slopguard-report.json
