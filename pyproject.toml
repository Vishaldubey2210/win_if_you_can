[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slopguard-ai"
version = "0.1.0"
description = "AI Dependency Control Plane and Supply-Chain Firewall"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "SLOPGUARD Core Security Team" }
]
keywords = [
    "security",
    "supply-chain",
    "dependencies",
    "ai-agents",
    "firewall",
    "control-plane",
    "hallucination-prevention",
    "typosquatting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
slopguard = "slopguard.cli.main:cli"

[project.urls]
Homepage = "https://github.com/slopguard/slopguard"
Repository = "https://github.com/slopguard/slopguard"
Documentation = "https://github.com/slopguard/slopguard#readme"
Issues = "https://github.com/slopguard/slopguard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["slopguard*"]

[tool.setuptools.package-data]
"slopguard.api" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
